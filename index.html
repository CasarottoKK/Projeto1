<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Careca de Ferro - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estiloTelainicial.css">
</head>

<body class="d-flex align-items-center min-vh-100">

    <main class="container py-4">
        <div class="card login-card mx-auto p-4 text-center">
            <img src="img/logo.jpg" alt="TopCars Logo" class="img-fluid mx-auto mb-3" style="max-height: 120px;">
            <h1 class="h3 mb-4">Login</h1>

            <form action="tela inicial.html" class="text-start">
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email" required>
                    <label for="email">Email</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="senha" placeholder="Senha" required>
                    <label for="senha">Senha</label>
                </div>
                <button type="submit" class="btn btn-red w-100">Entrar</button>
            </form>
            <a class="btn btn-outline-light w-100 mt-2" href="cadastro.html">Cadastrar</a>
        </div>
    </main>

</body>

</html>
